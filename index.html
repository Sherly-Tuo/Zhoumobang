<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>周末帮 · 大学生周末兼职撮合平台</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--y:#FFD100;--y2:#FFC300;--ys:#FFF8D1;--ink:#1A1A1A;--sub:#5E5E5E;--mute:#9A9A9A;--line:#EEEEEE;--bg:#F4F4F4;--red:#FF4A26;--org:#FF7A00;--green:#00A870;--blue:#3B7BFF;
--num:"DIN Alternate","DIN","Helvetica Neue",Arial,sans-serif}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:var(--ink);
background:#FFE45C;background-image:radial-gradient(circle at 18% 20%,#FFF3A8 0,transparent 45%),radial-gradient(circle at 85% 90%,#FFC300 0,transparent 50%);overflow:hidden}
button{font:inherit;border:0;background:none;cursor:pointer;color:inherit}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* ---------- stage ---------- */
.stage{height:100vh;display:flex;align-items:center;justify-content:center;gap:72px;padding:20px}
.intro{width:360px;flex-shrink:0}
.intro .brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.intro .brand .lg{width:52px;height:52px;border-radius:14px;background:var(--ink);color:var(--y);display:grid;place-items:center;font-weight:900;font-size:18px;letter-spacing:-1px}
.intro h1{font-size:30px;line-height:1.2;font-weight:900;letter-spacing:-.5px}
.intro .brand p{font-size:13px;color:#5a4a00;margin-top:2px}
.intro h3{font-size:14px;margin:22px 0 10px;font-weight:800}
.pain{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;font-size:13px;line-height:1.45}
.pain .p{color:#6b5800;white-space:nowrap}
.pain .s{font-weight:600}
.flow{font-size:13px;line-height:1.9;padding-left:18px}
.intro .reset{margin-top:22px;background:var(--ink);color:var(--y);padding:10px 18px;border-radius:22px;font-weight:700;font-size:13px}
.intro .reset:hover{transform:translateY(-1px)}

.phone-wrap{transform-origin:center center;flex-shrink:0}
.phone{width:414px;height:868px;background:#141414;border-radius:64px;padding:12px;position:relative;
box-shadow:0 0 0 2px #3a3a3a inset,0 40px 80px rgba(90,60,0,.35),0 10px 20px rgba(0,0,0,.2)}
.phone:before{content:"";position:absolute;left:-3px;top:170px;width:3px;height:64px;background:#2a2a2a;border-radius:2px;box-shadow:0 84px 0 #2a2a2a}
.screen{width:390px;height:844px;border-radius:52px;overflow:hidden;position:relative;background:#fff;isolation:isolate}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:122px;height:35px;background:#000;border-radius:20px;z-index:200}
.statusbar{position:absolute;top:0;left:0;right:0;height:52px;display:flex;justify-content:space-between;align-items:center;padding:4px 32px 0 40px;font-size:15px;font-weight:600;z-index:190;pointer-events:none;transition:color .3s}
.statusbar.light{color:#fff}
.sb-r{display:flex;gap:6px;align-items:center}
.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:136px;height:5px;border-radius:3px;background:#111;z-index:190;pointer-events:none;transition:background .3s}
.homebar.light{background:#fff}
#app{position:absolute;inset:0}
.scr{position:absolute;inset:0;overflow:hidden;background:#fff}
.in-fade{animation:fadeIn .4s both}
.in-up{animation:upIn .55s cubic-bezier(.2,.8,.2,1) both}
.scr.out{animation:fadeOut .35s both;pointer-events:none}
@keyframes fadeIn{from{opacity:0}}
@keyframes fadeOut{to{opacity:0}}
@keyframes upIn{from{transform:translateY(40px);opacity:0}}

/* toast */
#toast{position:absolute;left:50%;top:90px;transform:translate(-50%,-20px);background:rgba(20,20,20,.9);color:#fff;font-size:13px;padding:10px 16px;border-radius:20px;z-index:300;opacity:0;pointer-events:none;transition:.3s;max-width:320px;text-align:center;line-height:1.4}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- home screen ---------- */
.home{position:absolute;inset:0;background:linear-gradient(160deg,#2B2A5A 0%,#5B3E8A 45%,#E0935B 100%);color:#fff;padding:0 22px}
.home:after{content:"";position:absolute;width:420px;height:420px;border-radius:50%;background:radial-gradient(#FFD10055,transparent 70%);right:-160px;top:180px;pointer-events:none}
.h-clock{text-align:center;padding-top:74px}
.h-date{font-size:17px;font-weight:500;opacity:.9}
.h-time{font-size:84px;font-weight:300;letter-spacing:-2px;line-height:1;font-family:var(--num)}
.glass{background:rgba(255,255,255,.18);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.2)}
.h-widget{margin:28px 0 30px;border-radius:24px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.hw-l span{font-size:12px;opacity:.85;display:block}
.hw-l b{font-size:38px;font-family:var(--num);font-weight:700;margin-right:6px}
.hw-l em{font-style:normal;font-size:13px}
.hw-r{width:52px;height:52px;border-radius:14px;background:var(--y);color:var(--ink);display:grid;place-items:center;font-weight:900;font-size:17px}
.h-apps{display:grid;grid-template-columns:repeat(4,1fr);gap:22px 10px;position:relative;z-index:1}
.h-app{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;cursor:pointer}
.h-ic{width:62px;height:62px;border-radius:16px;display:grid;place-items:center;font-size:30px;position:relative;box-shadow:0 4px 12px rgba(0,0,0,.15);transition:transform .15s}
.h-app:active .h-ic{transform:scale(.9)}
.h-ic.me{color:var(--ink);font-weight:900;font-size:19px;letter-spacing:-1px}
.h-ic.me:before{content:"";position:absolute;inset:-6px;border-radius:21px;border:2px solid var(--y);animation:pulse 1.8s infinite}
@keyframes pulse{0%{opacity:.9;transform:scale(.95)}100%{opacity:0;transform:scale(1.25)}}
.badge{position:absolute;top:-6px;right:-6px;background:#FF3B30;color:#fff;font-size:12px;min-width:22px;height:22px;border-radius:11px;display:grid;place-items:center;font-style:normal;font-weight:600;letter-spacing:0}
.h-hint{text-align:center;margin-top:40px;font-size:14px;opacity:.95;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.h-dock{position:absolute;left:12px;right:12px;bottom:22px;border-radius:32px;padding:14px 18px;display:flex;justify-content:space-between}
.h-dock .h-ic{width:58px;height:58px}
.expand{position:absolute;background:var(--y);z-index:250;transition:all .45s cubic-bezier(.6,.05,.3,1)}

/* ---------- splash ---------- */
.splash{position:absolute;inset:0;background:var(--y);display:flex;flex-direction:column;align-items:center;justify-content:center}
.sp-logo{width:104px;height:104px;border-radius:28px;background:var(--ink);color:var(--y);display:grid;place-items:center;font-size:36px;font-weight:900;letter-spacing:-2px;animation:pop .7s cubic-bezier(.3,1.6,.5,1) both}
.sp-name{font-size:30px;font-weight:900;margin-top:20px;animation:upIn .5s .25s both}
.sp-tag{font-size:15px;margin-top:8px;color:#4a3d00;animation:upIn .5s .4s both}
.sp-loader{width:120px;height:3px;background:rgba(0,0,0,.12);border-radius:2px;margin-top:40px;overflow:hidden}
.sp-loader i{display:block;height:100%;background:var(--ink);animation:load 1.5s ease-in-out both}
@keyframes load{from{width:0}to{width:100%}}
.sp-bottom{position:absolute;bottom:56px;font-size:13px;color:#4a3d00}
.sp-bottom b{font-weight:900;color:var(--ink)}
@keyframes pop{from{transform:scale(.3);opacity:0}}

/* ---------- login ---------- */
.login{position:absolute;inset:0;background:linear-gradient(180deg,var(--y) 0,var(--y) 250px,#fff 250px);overflow-y:auto}
.login::-webkit-scrollbar{display:none}
.lg-hero{padding:78px 26px 26px;position:relative}
.lg-hero .mini{width:48px;height:48px;border-radius:13px;background:var(--ink);color:var(--y);display:grid;place-items:center;font-weight:900;font-size:17px;letter-spacing:-1px}
.lg-hero h1{font-size:27px;font-weight:900;margin-top:16px}
.lg-hero p{font-size:14px;color:#4a3d00;margin-top:6px}
.lg-hero .deco{position:absolute;right:22px;top:92px;font-size:64px;transform:rotate(12deg);opacity:.9}
.lg-body{background:#fff;border-radius:24px 24px 0 0;padding:24px 22px 40px;margin-top:-4px;position:relative}
.lg-lb{font-size:15px;font-weight:700;margin-bottom:12px}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:22px}
.role{border:2px solid var(--line);border-radius:18px;padding:16px 14px;cursor:pointer;transition:.2s;position:relative;background:#fafafa}
.role .e{font-size:32px}
.role b{display:block;font-size:16px;margin:8px 0 4px}
.role span{font-size:12px;color:var(--sub);line-height:1.5;display:block}
.role .ck{position:absolute;right:12px;top:12px;width:22px;height:22px;border-radius:50%;border:2px solid #ddd;display:grid;place-items:center;color:transparent;transition:.2s}
.role.on{border-color:var(--ink);background:var(--ys);transform:translateY(-2px);box-shadow:0 8px 18px rgba(255,195,0,.25)}
.role.on .ck{background:var(--ink);border-color:var(--ink);color:var(--y)}
.field{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:14px 2px;font-size:15px}
.field .pre{font-weight:600;min-width:52px}
.field input{flex:1;border:0;outline:0;background:none;font-size:16px;letter-spacing:.5px;min-width:0}
.field .code-btn{font-size:13px;color:var(--ink);background:var(--ys);padding:6px 12px;border-radius:14px;font-weight:600;white-space:nowrap}
.field .code-btn:disabled{color:var(--mute);background:#f2f2f2}
.btn-primary{background:var(--y);color:var(--ink);font-weight:700;border-radius:24px;height:48px;padding:0 22px;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .12s,filter .2s}
.btn-primary:active{transform:scale(.97)}
.btn-primary:disabled{background:#eee;color:var(--mute)}
.btn-primary.block{width:100%;margin-top:22px}
.btn-primary.sm{height:34px;font-size:14px;padding:0 16px;border-radius:17px}
.btn-line{height:34px;padding:0 14px;border-radius:17px;border:1px solid #ddd;font-size:13.5px;background:#fff;white-space:nowrap}
.agree{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mute);margin-top:16px;justify-content:center;cursor:pointer}
.agree i{width:16px;height:16px;border-radius:50%;border:1.5px solid #ccc;display:grid;place-items:center;color:transparent}
.agree i.on{background:var(--ink);border-color:var(--ink);color:var(--y)}
.agree a{color:var(--ink)}
.demo-note{margin-top:22px;background:#f7f7f7;border-radius:12px;padding:10px 12px;font-size:12px;color:var(--sub);text-align:center}
.spin{width:16px;height:16px;border:2px solid rgba(0,0,0,.2);border-top-color:var(--ink);border-radius:50%;animation:rot .7s linear infinite;display:inline-block}
@keyframes rot{to{transform:rotate(360deg)}}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* ---------- main shell ---------- */
.main{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.page{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:18px;position:relative}
.page::-webkit-scrollbar,.sub-scroll::-webkit-scrollbar,.rec-row::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none}
.tabbar{height:84px;background:#fff;border-top:1px solid var(--line);display:flex;padding:7px 6px 26px;position:relative;z-index:5}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;color:var(--mute);cursor:pointer;position:relative}
.tab em{font-style:normal}
.tab .ti{position:relative;width:30px;height:28px;display:grid;place-items:center}
.tab .ti:before{content:"";position:absolute;width:26px;height:26px;border-radius:50%;background:var(--y);transform:scale(0);transition:transform .3s cubic-bezier(.3,1.6,.5,1);right:-2px;top:-1px}
.tab .ti svg{position:relative}
.tab.on{color:var(--ink);font-weight:700}
.tab.on .ti:before{transform:scale(1)}
.tab.on .ti svg{animation:tabpop .35s}
@keyframes tabpop{50%{transform:scale(1.2)}}
.tab .dot{position:absolute;top:-3px;right:-8px;background:var(--red);color:#fff;font-size:10px;font-style:normal;min-width:16px;height:16px;border-radius:8px;display:grid;place-items:center;padding:0 4px;z-index:2;font-weight:600}
.tab.big .plus{width:46px;height:46px;border-radius:50%;background:var(--ink);color:var(--y);display:grid;place-items:center;margin-top:-20px;box-shadow:0 6px 14px rgba(0,0,0,.25);transition:transform .2s}
.tab.big:active .plus{transform:scale(.9)}
.tab.big.on{color:var(--ink);font-weight:700}
.layer{position:absolute;inset:0;pointer-events:none;z-index:50}
.layer>*{pointer-events:auto}

.card-in{animation:cardIn .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes cardIn{from{opacity:0;transform:translateY(14px)}}
.noanim .card-in{animation:none}

.ic{flex-shrink:0;display:block}
.ib{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;position:relative}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;padding:18px 16px 10px}
.sec-h b{font-size:17px;font-weight:800}
.sec-h span{font-size:12px;color:var(--mute)}
.sec-h .more{cursor:pointer;color:var(--sub)}
.list{padding:0 12px;display:flex;flex-direction:column;gap:10px}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:11px;padding:2px 6px;border-radius:4px;background:#F5F5F5;color:var(--sub)}
.tag.hot{background:#FFF1EC;color:var(--red)}
.tag.y{background:var(--ys);color:#7a5c00}
.st{font-size:11.5px;padding:3px 8px;border-radius:10px;font-weight:600;white-space:nowrap}
.st-wait{background:#FFF4E5;color:var(--org)}
.st-ok{background:#E6F7F0;color:var(--green)}
.st-run{background:#EAF1FF;color:var(--blue)}
.st-done{background:#F2F2F2;color:var(--mute)}
.st-no{background:#F2F2F2;color:var(--mute)}
.card{background:#fff;border-radius:14px;margin:10px 12px 0;padding:14px}
.c-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.c-h b{font-size:15px}
.c-h span{font-size:12px;color:var(--mute);cursor:pointer}

/* ---------- student market ---------- */
.m-head{background:linear-gradient(180deg,var(--y) 0%,var(--y) 70%,var(--bg) 100%);padding:54px 14px 10px}
.m-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.loc{display:flex;align-items:center;gap:4px;font-size:16px;font-weight:800;cursor:pointer}
.loc .caret{font-size:11px}
.m-bell{position:relative;cursor:pointer}
.m-bell i{position:absolute;top:0;right:0;width:8px;height:8px;background:var(--red);border-radius:50%;border:1.5px solid var(--y)}
.search{display:flex;align-items:center;background:#fff;border-radius:20px;height:40px;padding:0 4px 0 14px;gap:8px;border:2px solid var(--ink)}
.search input{flex:1;border:0;outline:0;font-size:14px;min-width:0;background:none}
.search .sbtn{background:var(--ink);color:var(--y);font-size:13px;font-weight:700;padding:6px 14px;border-radius:16px}
.banner{margin:6px 12px 0;border-radius:14px;overflow:hidden;position:relative;height:88px}
.bn-track{display:flex;height:100%;transition:transform .6s cubic-bezier(.6,.05,.3,1)}
.bn{min-width:100%;padding:16px 18px;display:flex;justify-content:space-between;align-items:center}
.bn b{font-size:18px;font-weight:900;display:block}
.bn span{font-size:12px;opacity:.85;margin-top:4px;display:block}
.bn .e{font-size:44px}
.bn-dots{position:absolute;bottom:8px;left:18px;display:flex;gap:4px}
.bn-dots i{width:5px;height:5px;border-radius:3px;background:rgba(0,0,0,.2);transition:.3s}
.bn-dots i.on{width:14px;background:rgba(0,0,0,.6)}
.kk{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 0;background:#fff;margin:10px 12px 0;border-radius:14px;padding:14px 4px}
.kk-i{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;cursor:pointer;color:var(--sub)}
.kk-i .e{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:#F7F7F7;transition:.2s}
.kk-i.on{color:var(--ink);font-weight:700}
.kk-i.on .e{background:var(--y);transform:translateY(-2px)}
.rec-row{display:flex;gap:10px;overflow-x:auto;padding:0 12px 2px;scroll-snap-type:x mandatory}
.rec{min-width:148px;background:#fff;border-radius:14px;padding:12px;cursor:pointer;scroll-snap-align:start;position:relative}
.rec .th{height:64px;border-radius:10px;display:grid;place-items:center;font-size:34px;margin-bottom:8px}
.rec .mt{position:absolute;top:18px;right:18px;background:var(--ink);color:var(--y);font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:8px}
.rec b{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec .p{color:var(--red);font-size:12px;margin-top:4px}
.rec .p strong{font-family:var(--num);font-size:17px}
.rec .w{font-size:11px;color:var(--mute);margin-top:2px}
.fbar{position:sticky;top:0;z-index:4;background:var(--bg);padding:10px 12px}
.chips{display:flex;gap:8px;overflow-x:auto}
.chip{font-size:13px;padding:6px 12px;border-radius:16px;background:#fff;white-space:nowrap;cursor:pointer;transition:.2s;border:1px solid transparent}
.chip.on{background:var(--ys);border-color:var(--y2);font-weight:700}
.job{background:#fff;border-radius:14px;padding:12px;display:flex;gap:12px;cursor:pointer;transition:transform .15s}
.job:active{transform:scale(.985)}
.job-l{width:64px;height:64px;border-radius:12px;display:grid;place-items:center;font-size:32px;flex-shrink:0}
.job-r{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.job-t{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.job-t .t{font-size:15.5px;font-weight:700;line-height:1.3}
.pay{color:var(--red);white-space:nowrap;font-size:11px}
.pay b{font-family:var(--num);font-size:19px}
.pay small{font-size:11px}
.new{font-style:normal;background:var(--red);color:#fff;font-size:10px;padding:1px 4px;border-radius:4px;margin-right:4px;vertical-align:2px}
.job-m{font-size:12px;color:var(--sub)}
.job-f{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mute);margin-top:2px}
.shop{display:flex;align-items:center;gap:4px;min-width:0;white-space:nowrap;overflow:hidden}
.vf{font-style:normal;display:inline-flex;align-items:center;gap:1px;color:#B88A00;font-size:10.5px}
.left.warn{color:var(--org)}
.empty{text-align:center;padding:40px 20px;color:var(--mute);font-size:13px}
.empty .e{font-size:42px;margin-bottom:8px}

/* ---------- sub pages / sheets ---------- */
.sub{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .38s cubic-bezier(.2,.8,.2,1);z-index:20;box-shadow:-10px 0 30px rgba(0,0,0,.08)}
.sub.show{transform:none}
.sub-top{height:96px;padding:50px 10px 0;display:flex;align-items:center;justify-content:space-between;font-size:17px;font-weight:700;background:#fff;flex-shrink:0;position:relative;z-index:3}
.sub-top.trans{position:absolute;left:0;right:0;top:0;background:transparent}
.sub-top.trans .ib{background:rgba(255,255,255,.85)}
.sub-scroll{flex:1;overflow-y:auto;padding-bottom:20px}
.hero{height:230px;display:grid;place-items:center;position:relative}
.hero-e{font-size:96px;animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.d-card{background:#fff;border-radius:14px;margin:10px 12px 0;padding:16px}
.d-main{margin-top:-28px;position:relative}
.d-title{font-size:21px;font-weight:800;line-height:1.3}
.d-pay{margin:8px 0 10px;color:var(--red);font-size:13px;display:flex;align-items:baseline;gap:8px}
.d-pay b{font-family:var(--num);font-size:30px}
.d-est{color:var(--sub);font-size:12px;background:#f6f6f6;padding:2px 8px;border-radius:8px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.fact{background:#FAFAFA;border-radius:10px;padding:10px}
.fact span{font-size:11.5px;color:var(--mute);display:block}
.fact b{font-size:14px;margin-top:3px;display:block}
.guar{margin:10px 12px 0;background:var(--ys);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;color:#7a5c00}

function openChat(cid){
 const c=S.chats.find(x=>x.id===cid);c.unread=0;renderTabbar();
 const qs=c.side==='s'?['需要几点到？','要穿什么衣服？','可以开实习证明吗？','包餐吗？']:['周六 8 点到店','记得带健康证','已为你录用，周末见'];
 pushPage(`<div class="sub-top"><button class="ib" data-act="back" aria-label="返回">${ic('back')}</button><span style="font-size:16px">${esc(c.name)}</span><span class="ib"></span></div>
 <div class="sub-scroll chat-body" id="chatBody">${c.msgs.map(bubble).join('')}</div>
 <div class="qr">${qs.map(q=>`<span data-act="qsend" data-cid="${cid}" data-v="${q}">${q}</span>`).join('')}</div>
 <div class="chat-in"><input id="chatInput" data-cid="${cid}" placeholder="发消息…" aria-label="消息"><button class="send" data-act="send" data-cid="${cid}" aria-label="发送">${ic('send',18)}</button></div>`);
}
function reply(t,side){
 if(side==='m')return['好的老板，我一定准时到！','收到～需要提前准备什么吗？','👌 周末见！'][Math.floor(Math.random()*3)];
 if(/证明/.test(t))return'可以的，完工后在平台一键申请电子实习证明～';
 if(/穿|衣/.test(t))return'深色长裤加运动鞋就行，工服我们提供';
 if(/几点|到岗|时间/.test(t))return'提前 15 分钟到，找店长签到就行';
 if(/餐|吃/.test(t))return'中午包一顿工作餐哦';
 return['好的收到～','没问题，有事随时在平台联系我','👌 期待周末见！'][Math.floor(Math.random()*3)];
}
function sendMsg(cid,text){
 text=(text||'').trim();if(!text)return;
 const c=S.chats.find(x=>x.id===cid);c.msgs.push({f:'me',t:text});c.time='刚刚';
 const body=cur('#chatBody');body.insertAdjacentHTML('beforeend',bubble({f:'me',t:text}));body.scrollTop=body.scrollHeight;
 const inp=cur('#chatInput');if(inp)inp.value='';
 setTimeout(()=>{const b=cur('#chatBody');if(!b)return;b.insertAdjacentHTML('beforeend','<div class="bub them typing" id="typing"><i></i><i></i><i></i></div>');b.scrollTop=b.scrollHeight;
  setTimeout(()=>{const ty=cur('#typing');if(ty)ty.remove();const r=reply(text,c.side);c.msgs.push({f:'them',t:r});const b2=cur('#chatBody');if(b2){b2.insertAdjacentHTML('beforeend',bubble({f:'them',t:r}));b2.scrollTop=b2.scrollHeight}},1100)},400);
}
function chatForJob(id){
 const j=J(id);let c=S.chats.find(x=>x.side==='s'&&x.name.startsWith(j.shop));
 if(!c){c={id:'s'+Date.now(),side:'s',name:j.shop,av:j.emoji,color:j.bg,time:'刚刚',unread:0,msgs:[{f:'sys',t:'咨询岗位：'+j.title},{f:'them',t:'你好同学，岗位有什么想了解的都可以问我～'}]};S.chats.unshift(c)}
 openChat(c.id);
}

  const id=+t.dataset.id,j=J(id),a=appOf(id),amt=income(j),from=S.earn.month;
  a.status='已完成';a.earned=amt;S.earn.month+=amt;S.earn.done++;
  success({title:'工资已到账',amt:amt,sub:`「${esc(j.title)}」商家已确认完工，钱已进你的周末帮钱包`,btn:'好的',act:'afterPay'});
  A._pay=from;
 },
 afterPay:()=>{closeSucc();refresh();const el=cur('#earnNum');if(el)countUp(el,A._pay,S.earn.month)},
 rate:t=>{sheet(`<div class="sh-h"><b>评价商家</b><button class="ib" data-act="closeSheet">${ic('x',18)}</button></div>
  <div style="text-align:center;font-size:34px;letter-spacing:6px;margin:6px 0 12px" id="stars">${'<span data-act="star" style="cursor:pointer">⭐</span>'.repeat(5)}</div>
  <div class="quick">${['工资准时','店长友好','活不累','包餐好吃','会再来'].map(x=>`<span class="qt" data-act="qt">${x}</span>`).join('')}</div>
  <button class="btn-primary block" data-act="rateDone">提交评价</button>`)},
 star:()=>{},
 rateDone:()=>{closeSheet();toast('感谢评价，信用分 +1')},
 chat:t=>openChat(t.dataset.id),
 send:t=>sendMsg(t.dataset.cid,cur('#chatInput').value),
 qsend:t=>sendMsg(t.dataset.cid,t.dataset.v),
 slot:t=>{const k=t.dataset.k;S.free.has(k)?S.free.delete(k):S.free.add(k);t.classList.toggle('on',S.free.has(k));toast('空闲时间已更新，推荐会跟着调整')},
 switchRole:()=>{S.role=S.role==='student'?'merchant':'student';S.tab=S.role==='student'?'market':'home';showMain()},
 logout:()=>{S.pick=S.role;showLogin()},
 /* merchant */
 cf:t=>{S.cf=t.dataset.v;refresh()},
 smart:()=>{S.smart=!S.smart;renderTab(true);if(S.smart)toast('已按匹配度排序：综合空闲时间、技能、信用分和距离')},
 hire:t=>{
  const c=S.cands.find(x=>x.id==t.dataset.id),j=J(c.jobId);
  if(j.got>=j.need){toast('这个岗位已经招满了，可以在工作台加人数');return}
  c.status='已录用';j.got++;
  if(c.isYou){const a=appOf(c.jobId);if(a)a.status='已录用'}
  const el=cur('#cand-'+c.id);el.classList.add('hired');el.querySelector('.c-act').innerHTML='<span class="st st-ok">已录用</span>';
  toast(`已录用${c.name}，到岗提醒已发给对方`);renderTabbar();
 },
 reject:t=>{const c=S.cands.find(x=>x.id==t.dataset.id);c.status='已婉拒';const el=cur('#cand-'+c.id);el.style.maxHeight=el.offsetHeight+'px';requestAnimationFrame(()=>el.classList.add('gone'));
  if(c.isYou){const a=appOf(c.jobId);if(a)S.apps=S.apps.filter(x=>x!==a)}
  setTimeout(()=>{refresh()},420);toast('已婉拒，系统会给同学推荐其他岗位')},
 mchat:t=>{const c=S.cands.find(x=>x.id==t.dataset.id);let ch=S.chats.find(x=>x.side==='m'&&x.name.startsWith(c.name));
  if(!ch){ch={id:'m'+Date.now(),side:'m',name:c.name+' · '+c.school,av:c.name[0],color:c.color,time:'刚刚',unread:0,msgs:[{f:'sys',t:'该同学报名了「'+J(c.jobId).title+'」'}]};S.chats.unshift(ch)}openChat(ch.id)},
 fchip:t=>{S.form[t.dataset.g]=t.dataset.v;t.parentNode.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===t))},
 ftag:t=>{const v=t.dataset.v,a=S.form.tags;a.includes(v)?a.splice(a.indexOf(v),1):a.push(v);t.classList.toggle('on',a.includes(v))},
 step:t=>{S.form.need=Math.max(1,Math.min(50,S.form.need+(+t.dataset.d)));cur('#needVal').textContent=S.form.need;updCost()},
 aigen:t=>{
  if(t.classList.contains('busy'))return;const f=S.form,ta=cur('#descTa');
  const title=f.title||`${f.day.slice(0,2)}${f.cat}兼职`;
  const work={餐饮:'点单收银、出餐打包和门店清洁',零售:'商品陈列、顾客引导和结账',活动:'布场、签到引导和现场秩序维护',家教:'作业辅导和知识点讲解',配送:'校园周边 3km 内的订单配送',仓储:'按单拣货、打包和上架',拍摄:'活动现场拍照和精修交付'}[f.cat];
  const txt=`【${title}】${f.day} ${f.start}-${f.end}，时薪 ${f.pay} 元${f.tags.length?'，'+f.tags.join('、'):''}。\n工作内容：${work}，到岗有人带，零经验也能很快上手。\n要求：在校大学生，守时、有责任心，能提前 10 分钟到岗签到。\n福利：工资由平台托管，完工当天到账${f.tags.includes('可开证明')?'，可开电子实习证明':''}。`;
  t.classList.add('busy');t.innerHTML=ic('spark',13)+'生成中…';ta.value='';let i=0;
  const iv=setInterval(()=>{i+=2;ta.value=txt.slice(0,i);ta.scrollTop=ta.scrollHeight;if(i>=txt.length){clearInterval(iv);S.form.desc=txt;if(!S.form.title){S.form.title=title;const ft=cur('#fTitle');if(ft)ft.value=title}t.classList.remove('busy');t.innerHTML=ic('spark',13)+'重新生成'}},18);
 },
 publish:t=>{
  const f=S.form;
  if(!f.title.trim()){const el=cur('#fTitle');el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');el.focus();toast('先给岗位起个名字');return}
  if(hoursOf(f)<=0){toast('结束时间要晚于开始时间');return}
  const [wd,day]=f.day.split(' ');
  const j={id:Date.now(),title:f.title.trim(),shop:'小熊烘焙·五道口店',emoji:CAT_STYLE[f.cat][0],bg:CAT_STYLE[f.cat][1],cat:f.cat,pay:f.pay,wd,day,time:`${f.start}-${f.end}`,hours:hoursOf(f),dist:0.9,walk:11,need:f.need,got:0,tags:f.tags.length?[...f.tags]:['日结'],match:94,rating:4.8,hired:73,addr:'五道口购物中心 B1',desc:f.desc||'商家暂未填写详细描述，可点「咨询」直接问。',req:['在校大学生','守时负责'],mine:1,isNew:1,fresh:1,views:0};
  S.jobs.unshift(j);S.balance-=costOf(f);
  t.innerHTML='<i class="spin"></i>发布中';t.disabled=true;
  setTimeout(()=>{success({title:'岗位已发布',sub:`已推送给学校周边 3km 内 236 位空闲时间匹配的同学。工资 ¥${costOf(f)} 已托管。`,btn:'回到工作台',act:'mHomeGo',ghost:'切到学生端看看这个岗位',gact:'seeAsStudent'});
   S.form={cat:'餐饮',title:'',day:'周六 10/3',start:'10:00',end:'18:00',pay:25,need:2,tags:['日结'],desc:''}},600);
 },
 mHomeGo:()=>{closeSucc();S.tab='home';renderTab(true);setTimeout(()=>{S.jobs.forEach(j=>j.fresh=0)},3000)},
 seeAsStudent:()=>{S.jobs.forEach(j=>j.fresh=0);S.role='student';S.tab='market';S.chip='综合推荐';S.cat='全部';S.q='';showMain()}
};

app.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t||!app.contains(t))return;const f=A[t.dataset.act];if(f)f(t,e)});
app.addEventListener('input',e=>{
 const el=e.target;
 if(el.id==='q'){S.q=el.value;refreshList();return}
 const f=el.dataset.f;if(!f)return;
 S.form[f]=el.type==='range'?+el.value:el.value;
 if(f==='pay')cur('#payVal').textContent=el.value;
 if(['pay','start','end'].includes(f))updCost();
});
app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='chatInput'){sendMsg(e.target.dataset.cid,e.target.value)}if(e.key==='Enter'&&e.target.id==='q'){e.target.blur()}});

showHome();
</script>
</body>
</html>
